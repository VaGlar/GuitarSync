<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuitarSync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Setup screen -->
  <div id="screen-setup" class="screen">
    <div class="brand"><img src="icons/icon32.png" alt="" class="brand-icon" /><span class="brand-name">GuitarSync</span></div>
    <p class="subtitle">Enter your Spotify Client ID to get started</p>
    <input id="client-id-input" type="text" placeholder="Spotify Client ID" spellcheck="false" />
    <button id="btn-login" class="btn btn-primary">Connect with Spotify</button>
    <a class="help-link" href="https://developer.spotify.com/dashboard" target="_blank">How do I get a Client ID →</a>
  </div>

  <!-- Main screen -->
  <div id="screen-main" class="screen hidden">

    <div class="brand"><img src="icons/icon32.png" alt="" class="brand-icon" /><span class="brand-name">GuitarSync</span></div>

    <!-- Track info -->
    <div id="track-card" class="track-card">
      <img id="track-image" src="" alt="Album Art" class="album-art" />
      <div class="track-info">
        <div id="track-name" class="track-name">—</div>
        <div id="track-artist" class="track-artist">—</div>
        <div id="track-status" class="track-status"></div>
      </div>
    </div>

    <div id="no-track" class="empty-state hidden">
      <span class="empty-icon">⏻</span>
      <span>STANDBY</span>
    </div>

    <!-- Auto mode -->
    <div class="auto-row">
      <span class="auto-label">AUTO</span>
      <label class="power-switch">
        <input id="auto-toggle" type="checkbox" />
        <span class="power-led"></span>
      </label>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="rocker">
        <button id="btn-chords" class="rocker-half active" data-value="Chords">CHORDS</button>
        <button id="btn-tabs" class="rocker-half" data-value="Tab">TABS</button>
      </div>
      <button id="btn-find" class="btn btn-primary" disabled>Find →</button>
    </div>

    <!-- Source badge -->
    <div id="source-badge" class="source-badge hidden"></div>

    <!-- Result -->
    <div id="result" class="result hidden">
      <div id="result-info" class="result-info"></div>
      <button id="btn-open" class="btn btn-open">Open again →</button>
    </div>

    <!-- Error -->
    <div id="error-msg" class="error-msg hidden"></div>

    <!-- History -->
    <div id="history" class="history hidden">
      <div class="history-header">
        <span>History</span>
        <button id="btn-clear-history" class="history-clear">Clear</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

    <button id="btn-refresh" class="btn-icon" title="Refresh">↻</button>
    <button id="btn-logout" class="btn-logout">Log out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
