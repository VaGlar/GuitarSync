<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuitarSync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Setup screen -->
  <div id="screen-setup" class="screen">
    <div class="logo">🎸 GuitarSync</div>
    <p class="subtitle">Βάλε το Spotify Client ID σου για να ξεκινήσεις</p>
    <input id="client-id-input" type="text" placeholder="Spotify Client ID" spellcheck="false" />
    <button id="btn-login" class="btn btn-primary">Σύνδεση με Spotify</button>
    <a class="help-link" href="https://developer.spotify.com/dashboard" target="_blank">Πώς να πάρω Client ID →</a>
  </div>

  <!-- Main screen -->
  <div id="screen-main" class="screen hidden">

    <!-- Track info -->
    <div id="track-card" class="track-card">
      <img id="track-image" src="" alt="Album Art" class="album-art" />
      <div class="track-info">
        <div id="track-name" class="track-name">—</div>
        <div id="track-artist" class="track-artist">—</div>
        <div id="track-status" class="track-status"></div>
      </div>
    </div>

    <div id="no-track" class="empty-state hidden">
      <span class="empty-icon">⏸</span>
      <span>Δεν παίζει τίποτα τώρα</span>
    </div>

    <!-- Auto mode -->
    <div class="auto-row">
      <div>
        <div class="auto-label">Auto mode</div>
        <div class="auto-sub">Αλλάζει συγχορδίες αυτόματα με το τραγούδι</div>
      </div>
      <label class="switch">
        <input id="auto-toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="toggle-group">
        <button id="btn-chords" class="toggle-btn active" data-value="Chords">Συγχορδίες</button>
        <button id="btn-tabs" class="toggle-btn" data-value="Tab">Tabs</button>
      </div>
      <button id="btn-find" class="btn btn-primary" disabled>Βρες →</button>
    </div>

    <!-- Source badge -->
    <div id="source-badge" class="source-badge hidden"></div>

    <!-- Result -->
    <div id="result" class="result hidden">
      <div id="result-info" class="result-info"></div>
      <button id="btn-open" class="btn btn-open">Άνοιξε →</button>
    </div>

    <!-- Error -->
    <div id="error-msg" class="error-msg hidden"></div>

    <button id="btn-refresh" class="btn-icon" title="Ανανέωση">↻</button>
    <button id="btn-logout" class="btn-logout">Αποσύνδεση</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
